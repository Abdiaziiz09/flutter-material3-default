name: flutter_material3_default
description: >-
  A professional Flutter Material 3 foundation for mobile, web and desktop
  apps. Designed as the standard reference for AI coding agents.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Material 3 icons are bundled with the Flutter SDK through this flag.
  uses-material-design: true
