name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Format, analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build:
    name: Build ${{ matrix.platform }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: web
            os: ubuntu-latest
            build-command: flutter build web
          - platform: android
            os: ubuntu-latest
            build-command: flutter build apk --debug
          - platform: linux
            os: ubuntu-latest
            build-command: flutter build linux
          - platform: windows
            os: windows-latest
            build-command: flutter build windows
          - platform: macos
            os: macos-latest
            build-command: flutter build macos
          - platform: ios
            os: macos-latest
            build-command: flutter build ios --debug --no-codesign
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      # The repository stores only the Dart sources; the native platform
      # folders are generated so they always match the installed Flutter SDK.
      - name: Generate the ${{ matrix.platform }} platform folder
        run: flutter create . --org com.example --platforms=${{ matrix.platform }}

      - name: Install dependencies
        run: flutter pub get

      - name: Build
        run: ${{ matrix.build-command }}
